<style>

  /* jemný tmavý vinětační přechod v pravém horním rohu, jako na předloze */

<script type="importmap">

<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------
   NASTAVENÍ: tady se dá tvar i materiál doladit
------------------------------------------------------------------ */
const CFG = {
  width:      3.00,   // šířka trička ve scéně, výška se dopočítá z poměru obrázku
  hover:      0.22,   // klidová výška nad trávou
  float:      0.13,   // rozkmit vznášení nahoru a dolů
  floatSpeed: 0.65,
  sway:       0.30,   // rozkyv kolem svislé osy v radiánech
  swaySpeed:  0.42,
  puff:       0.30,   // hloubka nafouknutí, celková tloušťka je dvojnásobek
  wave:       0.045,  // vlnění látky, násobí se výškovou mapou
  waveSpeed:  1.15,
  fold:       0.055,  // hloubka náhodných záhybů, ty se pomalu přelévají
  drape:      0.105,  // hloubka skutečného splývání vytaženého z fotky
  weave:      0.26,   // síla pleteniny v normálové mapě
  silh:       0.030,  // rozvlnění obrysu, hlavně lemu a rukávů
  thru:       0.035,   // prosvícení bavlny sluncem zezadu
  rim:        0.055,  // světlo z oblohy na vlasu látky po obrysu
  exposure:   1.15,
  blurNear:   16.0,   // rozostření popředí v pixelech při výšce okna 750
  blurFar:    5.5,    // rozostření pozadí
  grain:      0.020,  // zrno
  vignette:   0.26
};

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------------------- scéna ---------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = CFG.exposure;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

/* Pozadí musí být uvnitř scény, ne jen v CSS. Transmission vzorkuje
   scénu za objektem, a CSS pod canvasem pro něj neexistuje.
   Barva oblohy u obzoru musí sedět na barvu mlhy, jinak je na
   okraji země vidět ostrá vodorovná hrana.                         */
const FOG_COLOR = 0x2f86c4;

/* Slunce potřebuje znát i obloha, aby na správném místě zesvětlala,
   a stín, aby ležel na odvrácené straně. Proto je pozice tady. */
const SUN_POS = new THREE.Vector3(-7, 2.6, -9);

const FOG_HEX = '#eef1ee';

/* Opar nad loukou je o kus zelenější než obloha. Kdyby byl stejný,
   ztratí se v něm tráva úplně a mezi ní a obzorem zůstane bílá díra. */
const HAZE_HEX = '#dfe5dc';

/* Obloha se kreslí podle toho, kde na obrazovce leží obzor. Mlha se
   nanáší až po tone mappingu, takže dole vyjde přesně FOG_HEX, a aby
   na hraně země nebyl schod, musí tam obloha končit stejnou barvou.  */
function backdrop(horizon) {
  const W = 256, H = 512;
  const hz = Number.isFinite(horizon) ? Math.max(0.06, Math.min(0.94, horizon)) : 0.25;
  const flat = Math.max(0, hz - 0.05);            // plochý pás těsně nad obzorem

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');

  const g = x.createLinearGradient(0, 0, 0, flat * H);
  g.addColorStop(0.00, '#a9c5d6');
  g.addColorStop(0.40, '#d6e2e2');
  g.addColorStop(0.75, '#e7ecea');
  g.addColorStop(1.00, FOG_HEX);
  x.fillStyle = g;
  x.fillRect(0, 0, W, Math.ceil(flat * H));

  // prosvětlení vlevo, kreslené jen nad plochý pás, ať ho nezabarví
  const glow = x.createRadialGradient(W * 0.28, flat * H * 0.55, 0, W * 0.28, flat * H * 0.55, W * 0.9);
  glow.addColorStop(0, 'rgba(255,247,232,0.40)');
  glow.addColorStop(1, 'rgba(255,247,232,0)');
  x.fillStyle = glow;
  x.fillRect(0, 0, W, Math.ceil(flat * H));

  // prosvětlení se musí vytratit dřív, než pás začne, jinak vznikne
  // schod přesně na jeho horní hraně
  const fade = x.createLinearGradient(0, flat * H * 0.62, 0, flat * H);
  fade.addColorStop(0, 'rgba(238,241,238,0)');
  fade.addColorStop(1, 'rgba(238,241,238,1)');
  x.fillStyle = fade;
  x.fillRect(0, Math.floor(flat * H * 0.62), W, Math.ceil(flat * H * 0.38) + 2);

  /* Zář kolem slunce. Slunce je kousek za levým okrajem záběru, do
     obrazu spadne jen jeho rozptýlené světlo v oparu. Bez něj není
     v obloze poznat, odkud se svítí.                                */
  const sp = SUN_POS.clone().normalize().multiplyScalar(1e5).project(camera);
  const sx = (sp.x * 0.5 + 0.5) * W, sy = (1 - (sp.y * 0.5 + 0.5)) * H;
  const halo = x.createRadialGradient(sx, sy, 0, sx, sy, H * 0.62);
  halo.addColorStop(0.00, 'rgba(255,244,222,0.85)');
  halo.addColorStop(0.35, 'rgba(255,240,216,0.32)');
  halo.addColorStop(1.00, 'rgba(255,238,214,0)');
  x.save();
  x.beginPath(); x.rect(0, 0, W, Math.ceil(flat * H)); x.clip();
  x.fillStyle = halo;
  x.fillRect(0, 0, W, Math.ceil(flat * H));
  x.restore();

  /* Vrstevnatý opar. Čistý přechod vypadá jako pozadí z fotoateliéru,
     obloha má vždycky nějakou nestejnoměrnost.                       */
  x.save();
  x.beginPath(); x.rect(0, 0, W, Math.ceil(flat * H)); x.clip();
  x.globalAlpha = 0.5;
  for (let i = 0; i < 7; i++) {
    const y0 = (0.05 + hash2(i * 3.1, 7.7) * 0.75) * flat * H;
    const hh = (8 + hash2(i * 5.7, 2.3) * 46);
    const g2 = x.createLinearGradient(0, y0 - hh, 0, y0 + hh);
    const a = 0.05 + hash2(i * 1.9, 4.4) * 0.07;
    g2.addColorStop(0, 'rgba(255,255,255,0)');
    g2.addColorStop(0.5, `rgba(252,250,246,${a})`);
    g2.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g2;
    x.fillRect(0, y0 - hh, W, hh * 2);
  }
  x.restore();

  /* Oblačnost. Čistý přechod nemá obloha nikdy, a i slabý mrak dá
     obrazu měřítko. Kreslí se po pixelech, protože jde o šum, ne o
     tvar, a drží se nahoře — dole ji stejně spolkne opar.             */
  {
    const CW = 112, CH = 168;
    const cl = x.createImageData(CW, CH);
    for (let yy = 0; yy < CH; yy++) {
      const vy = yy / CH;
      const fade = Math.max(0, Math.min(1, (0.92 - vy) / 0.55)) * Math.min(1, vy / 0.10);
      for (let xx = 0; xx < CW; xx++) {
        const u = xx / CW * 6.2, w2 = vy * 3.4;
        let f = noise2(u, w2) * 0.55 + noise2(u * 2.3 + 4.1, w2 * 2.3) * 0.28
              + noise2(u * 4.7 + 9.3, w2 * 4.7) * 0.17;
        const a = Math.max(0, Math.min(1, (f - 0.52) * 3.6)) * fade;
        const k = (yy * CW + xx) * 4;
        cl.data[k] = 255; cl.data[k + 1] = 253; cl.data[k + 2] = 250;
        cl.data[k + 3] = Math.round(a * 78);
      }
    }
    const cc = document.createElement('canvas');
    cc.width = CW; cc.height = CH;
    cc.getContext('2d').putImageData(cl, 0, 0);
    x.save();
    x.beginPath(); x.rect(0, 0, W, Math.ceil(flat * H)); x.clip();
    x.imageSmoothingEnabled = true;
    x.drawImage(cc, 0, 0, W, Math.ceil(flat * H * 0.96));
    x.restore();
  }

  /* Vzdálená mez. Rozeznat se nedá skoro nic, ale bez jakéhokoli
     obrysu v oparu obzor nemá hloubku a končí prázdnou plochou.      */
  const hy = flat * H;
  x.save();
  x.globalAlpha = 0.15;
  x.fillStyle = '#5c6f63';
  x.beginPath();
  x.moveTo(0, hy);
  for (let i = 0; i <= 64; i++) {
    const u = i / 64;
    const k = noise2(u * 7.5, 3.3) * 0.6 + noise2(u * 21.0, 8.1) * 0.4;
    x.lineTo(u * W, hy - 4 - k * 16);
  }
  x.lineTo(W, hy); x.closePath(); x.fill();
  x.restore();

  // opar mez rozpouští odspodu, aby nikde neležela ostrá hrana
  const dissolve = x.createLinearGradient(0, hy - 22, 0, hy);
  dissolve.addColorStop(0, 'rgba(238,241,238,0.25)');
  dissolve.addColorStop(1, 'rgba(238,241,238,1)');
  x.fillStyle = dissolve;
  x.fillRect(0, Math.floor(hy) - 22, W, 23);

  x.fillStyle = FOG_HEX;
  x.fillRect(0, Math.ceil(flat * H) - 1, W, H);

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// kam na obrazovce padne obzor: bod nekonečně daleko ve vodorovném směru
const _fwd = new THREE.Vector3(), _hz = new THREE.Vector3();
function horizonFraction() {
  camera.getWorldDirection(_fwd);
  _hz.set(_fwd.x, 0, _fwd.z).normalize().multiplyScalar(1e6).add(camera.position).project(camera);
  const f = (1 - _hz.y) / 2;
  return Number.isFinite(f) ? f : 0.25;
}

function refreshSky() {
  scene.background?.dispose?.();
  scene.background = backdrop(horizonFraction());
}

const CAM_Z = 9.5;
const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, -0.75, CAM_Z);

/* ------------------- prostředí pro odlesky ----------------------
   Studio: ostrý horizont, světlá obloha, tmavá podlaha a několik
   softboxů. Ostrý horizont je klíčový, chrom potřebuje jednu
   výraznou hranu, kterou při otáčení převalí přes povrch.
   Kreslí se po pixelech, protože canvas fillRect nechává na
   equirect mapě svislý šev na u = 0.                              */
function envTexture() {
  const W = 1024, H = 512;
  const img = new ImageData(W, H);
  const d = img.data;

  const smooth = (e0, e1, x) => {
    const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  };
  const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t,
                              a[1] + (b[1] - a[1]) * t,
                              a[2] + (b[2] - a[2]) * t];

  const SKY_TOP  = [150, 192, 228];
  const SKY_LOW  = [104, 152, 200];
  const FLOOR_HI = [40,  84, 132];
  const FLOOR_LO = [10,  32,  62];

  // softboxy: u = azimut (obtéká dokola), v = výška
  const panels = [
    { u: 0.13, du: 0.21, v0: 0.02, v1: 0.60, soft: 0.070, i:  1.45 },
    { u: 0.62, du: 0.17, v0: 0.04, v1: 0.56, soft: 0.070, i:  1.20 },
    { u: 0.38, du: 0.05, v0: 0.00, v1: 0.52, soft: 0.090, i: -0.32 },
    { u: 0.87, du: 0.05, v0: 0.00, v1: 0.52, soft: 0.090, i: -0.32 },
    { u: 0.20, du: 0.16, v0: 0.60, v1: 0.90, soft: 0.100, i:  0.30 },
    { u: 0.30, du: 0.012, v0: 0.05, v1: 0.62, soft: 0.012, i:  2.10 }   // úzký pruh: dělá ostrý blik na hraně
  ];

  for (let y = 0; y < H; y++) {
    const v = y / (H - 1);
    const sky   = lerp3(SKY_TOP, SKY_LOW, smooth(0, 0.48, v));
    const floor = lerp3(FLOOR_HI, FLOOR_LO, smooth(0.5, 1, v));
    const base  = lerp3(sky, floor, smooth(0.475, 0.525, v));   // horizont

    for (let xp = 0; xp < W; xp++) {
      const u = xp / W;
      let add = 0;
      for (const p of panels) {
        let du = Math.abs(u - p.u);
        if (du > 0.5) du = 1 - du;                              // přes šev
        const mu = 1 - smooth(p.du, p.du + p.soft, du);
        const mv = smooth(p.v0 - p.soft, p.v0 + p.soft, v) *
                   (1 - smooth(p.v1 - p.soft, p.v1 + p.soft, v));
        add += p.i * mu * mv;
      }
      const k = (xp + y * W) * 4;
      d[k]     = Math.max(0, Math.min(255, base[0] + add * 130));
      d[k + 1] = Math.max(0, Math.min(255, base[1] + add * 132));
      d[k + 2] = Math.max(0, Math.min(255, base[2] + add * 135));
      d[k + 3] = 255;
    }
  }

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  c.getContext('2d').putImageData(img, 0, 0);

  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping;
  t.minFilter = THREE.LinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = false;
  return t;
}

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envMap = pmrem.fromEquirectangular(envTexture()).texture;
scene.environment = envMap;

/* --------------------------- tričko ----------------------------- */
/* Fotka je plochá, objem se dopočítal z její siluety: vzdálenostní
   transformace řekne, jak daleko je každý pixel od obrysu, a z toho
   vznikla výšková mapa. Trup je nejplnější, rukávy míň, u lemu jde
   výška na nulu. Skládají se z ní dvě skořepiny, přední a zadní,

/* Bavlna zblízka: pletenina má sloupečky oček a vlas. Bez jemného
   reliéfu je látka dokonale hladká plocha a čte se jako guma.
   Mapa se dlaždicuje, takže stačí malá a bezešvá.                   */
function weaveTexture() {
  const S = 256, ROWS = 34;
  const h = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const u = x / S, v = y / S;
      const row = Math.floor(v * ROWS);
      const off = (row & 1) ? 0.5 : 0.0;              // každá druhá řada posunutá
      const cx = ((u * ROWS + off) % 1) - 0.5;
      const cy = ((v * ROWS) % 1) - 0.5;
      h[y * S + x] = Math.cos(cx * Math.PI) * Math.cos(cy * Math.PI * 0.85) * 0.8
                   + (hash2(x * 7.31, y * 3.17) - 0.5) * 0.75;   // vlas příze
    }
  }
  const at = (x, y) => h[((y % S) + S) % S * S + (((x % S) + S) % S)];
  const img = new ImageData(S, S);
  const d = img.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = at(x + 1, y) - at(x - 1, y);
    const dy = at(x, y + 1) - at(x, y - 1);
    const nz = 0.7;
    const l = Math.hypot(dx, dy, nz);
    const k = (x + y * S) * 4;
    d[k]     = (-dx / l * 0.5 + 0.5) * 255;
    d[k + 1] = (-dy / l * 0.5 + 0.5) * 255;
    d[k + 2] = ( nz / l * 0.5 + 0.5) * 255;
    d[k + 3] = 255;
  }
  const c = document.createElement('canvas');
  c.width = c.height = S;
  c.getContext('2d').putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(30, 30);
  t.anisotropy = 4;
  return t;
}

/* Splývání látky z fotky. Předloha je studiový snímek, takže v ní
   jsou skutečné záhyby, švy, lem rukávů i límec — jenže rozdíl mezi
   nejsvětlejším a nejtmavším místem černého trička je asi deset
   hodnot z dvěstěpadesáti a v hotovém obraze se ztratí. Když se z
   toho signálu udělá výška, začnou ty pravé záhyby vrhat světlo a
   stín podle slunce ve scéně, ne podle ateliéru.

   Postup: zmenšit (zbaví se to komprese), potisk a okolí vyříznout a
   zaplnit okolím, rozmazat, a odečíst hodně rozmazanou verzi. Zůstane
   jen reliéf, velký tvar už dělá nafouknutí.                        */
function drapeTexture(img) {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, S, S);
  const d = x.getImageData(0, 0, S, S).data;

  const N = S * S;
  const v = new Float32Array(N);
  const ok = new Uint8Array(N);
  let sum = 0, cnt = 0;
  for (let i = 0; i < N; i++) {
    const l = (0.2126 * d[i * 4] + 0.7152 * d[i * 4 + 1] + 0.0722 * d[i * 4 + 2]) / 255;
    v[i] = l;
    // vyřízne se jen bílý potisk; všitá etiketa je tmavá a patří do reliéfu
    ok[i] = (d[i * 4 + 3] > 200 && l < 0.32) ? 1 : 0;
    if (ok[i]) { sum += l; cnt++; }
  }
  if (!cnt) return null;
  const mean = sum / cnt;

  /* Maska se ještě roztáhne. Okraj potisku je do látky odmíchaný a
     kdyby zůstal, obtáhne se kolem písmen val.                       */
  for (let r = 0; r < 3; r++) {
    const grow = Uint8Array.from(ok);
    for (let y = 1; y < S - 1; y++) for (let xx = 1; xx < S - 1; xx++) {
      const i = y * S + xx;
      if (!ok[i]) {
        grow[i - 1] = grow[i + 1] = grow[i - S] = grow[i + S] = 0;
      }
    }
    ok.set(grow);
  }

  /* Potisk a pozadí se přebijí průměrem látky. Kdyby tam zůstalo bílé
     pozadí, rozmazání ho vtáhne dovnitř a kolem celého trička vznikne
     falešný val — a hlavně by ty bílé hodnoty ovládly měřítko a
     skutečné záhyby by v něm zanikly.                                 */
  for (let i = 0; i < N; i++) if (!ok[i]) v[i] = mean;

  // potisk se dorovná okolní látkou, ať po něm nezůstane plocha
  const valid = Uint8Array.from(ok);
  const tmp = new Float32Array(N);
  for (let pass = 0; pass < 70; pass++) {
    tmp.set(v);
    for (let y = 1; y < S - 1; y++) for (let xx = 1; xx < S - 1; xx++) {
      const i = y * S + xx;
      if (valid[i]) continue;
      let a = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const j = i + dy * S + dx;
        if (valid[j]) { a += v[j]; n++; }
      }
      if (n >= 2) { tmp[i] = a / n; valid[i] = 2; }
    }
    v.set(tmp);
    for (let i = 0; i < N; i++) if (valid[i] === 2) valid[i] = 1;
  }

  const box = (src, r) => {
    const a = new Float32Array(N), b = new Float32Array(N);
    for (let y = 0; y < S; y++) {
      for (let xx = 0; xx < S; xx++) {
        let t = 0;
        for (let k = -r; k <= r; k++) t += src[y * S + Math.min(S - 1, Math.max(0, xx + k))];
        a[y * S + xx] = t / (2 * r + 1);
      }
    }
    for (let xx = 0; xx < S; xx++) {
      for (let y = 0; y < S; y++) {
        let t = 0;
        for (let k = -r; k <= r; k++) t += a[Math.min(S - 1, Math.max(0, y + k)) * S + xx];
        b[y * S + xx] = t / (2 * r + 1);
      }
    }
    return b;
  };

  // reliéf = jemný detail minus velký tvar; ten už dělá nafouknutí
  const fine = box(box(v, 3), 3);   // dvakrát, jinak jsou z komprese boule
  const flat = box(v, 16);
  for (let i = 0; i < N; i++) v[i] = fine[i] - flat[i];

  /* Měřítko podle percentilu, ne podle maxima. Jediný ojedinělý pixel
     u švu by jinak stlačil celý reliéf k nule. Nižší percentil navíc
     srazí ojedinělé výrazné kusy — třeba všitou etiketu, která by jinak
     u límce vystoupila jako poutko.                                   */
  const mag = [];
  for (let i = 0; i < N; i++) if (ok[i]) mag.push(Math.abs(v[i]));
  mag.sort((a, b) => a - b);
  const scale = 1 / Math.max(1e-5, mag[Math.floor(mag.length * 0.88)]);

  const img2 = new ImageData(S, S);
  for (let i = 0; i < N; i++) {
    // měkké omezení: silné kusy se srazí, jemné záhyby zůstanou
    const u = v[i] * scale;
    const g = Math.round((Math.tanh(u) * 0.5 + 0.5) * 255);
    img2.data[i * 4] = img2.data[i * 4 + 1] = img2.data[i * 4 + 2] = g;
    img2.data[i * 4 + 3] = 255;
  }
  x.putImageData(img2, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.minFilter = THREE.LinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = false;
  return t;
}

const loader = new THREE.TextureLoader();

/* Rozměry i mapa splývání se dají spočítat až z načteného obrázku,
   takže se na něj musí počkat. Textura sama má .image prázdné, dokud
   loader nedoběhne — na to se spolehnout nedá.                       */
const shirtTex = loader.load(SHIRT_SRC, fitShirt);
shirtTex.colorSpace = THREE.SRGBColorSpace;
shirtTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

const heightTex = loader.load(HEIGHT_SRC);   // data, ne barva: bez sRGB převodu
heightTex.minFilter = THREE.LinearFilter;
heightTex.magFilter = THREE.LinearFilter;
heightTex.generateMipmaps = false;

const weaveTex = weaveTexture();

/* Než se fotka načte, splývání je nulové: jeden šedý pixel znamená
   „nikde nic“, protože polovina rozsahu je klid.                     */
const drapeU = { value: (() => {
  const t = new THREE.DataTexture(new Uint8Array([128, 128, 128, 255]), 1, 1);
  t.needsUpdate = true;
  return t;
})() };

const cloth = { value: 0 };
const sizeU = { value: new THREE.Vector2(CFG.width, CFG.width) };   // sdílené, ať jde po načtení obrázku opravit

function shellMaterial(sign) {
  const mat = new THREE.MeshPhysicalMaterial({
    map: shirtTex,
    normalMap: weaveTex,
    normalScale: new THREE.Vector2(CFG.weave, CFG.weave),
    transparent: true,
    alphaTest: 0.62,        // ostrý obrys bez závoje kolem trička
    side: THREE.DoubleSide,
    roughness: 0.86,        // bavlna je matná, lesk dělá až sheen
    metalness: 0.0,
    sheen: 0.30,            // vlas látky: měkký lesk podél obrysu
    sheenColor: new THREE.Color(0x74889a),
    sheenRoughness: 0.72,   // drsnější lesk se u boku nesbalí do světlého lemu
    specularIntensity: 0.55, // odlesk oblohy na boku, jinak tam Fresnel udělá lem
    envMapIntensity: 0.35
  });

  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uHeight = { value: heightTex };
    shader.uniforms.uAmp    = { value: CFG.puff };
    shader.uniforms.uSign   = { value: sign };
    shader.uniforms.uSize   = sizeU;
    shader.uniforms.uTime   = cloth;
    shader.uniforms.uWave   = { value: CFG.wave };
    shader.uniforms.uFold   = { value: CFG.fold };
    shader.uniforms.uDrape  = drapeU;
    shader.uniforms.uDrapeAmp = { value: CFG.drape };
    shader.uniforms.uSilh   = { value: CFG.silh };
    shader.uniforms.uThru   = { value: CFG.thru };
    shader.uniforms.uRim    = { value: CFG.rim };
    shader.uniforms.uThruColor = { value: new THREE.Color(0x8a6a4a) };
    shader.uniforms.uRimColor  = { value: new THREE.Color(0x9fb4c4) };

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `
        #include <common>
        uniform sampler2D uHeight, uDrape;
        uniform float uAmp, uSign, uWave, uTime, uFold, uSilh, uDrapeAmp;
        uniform vec2 uSize;
        varying float vThick;
        float puff(vec2 q) { return texture2D(uHeight, q).r; }
        float ripple(vec2 p) {
          return sin(p.x * 2.9 + uTime) * 0.55
               + sin(p.y * 2.1 - uTime * 0.8) * 0.30
               + sin((p.x + p.y) * 3.7 + uTime * 1.6) * 0.15;
        }
        float h21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.545); }
        float vnoise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(h21(i),                h21(i + vec2(1.0, 0.0)), f.x),
                     mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
        }
        /* Záhyby. Napříč hustší než podél, aby vznikly svislé řasy,
           ne kulaté boule. Vrstvy se sčítají, jedna sama vypadá jako
           promáčklina.                                                */
        float folds(vec2 p) {
          vec2 q = vec2(p.x * 3.2, p.y * 1.15) + uTime * 0.035;
          /* Jemnější vrstvu už síť 150×150 neuveze: normála se počítá
             z rozdílu výšek, takže by na každém vrcholu vyšla jinam a
             látka by se zrnila. Frekvence musí zůstat pod hustotou
             sítě.                                                     */
          return (vnoise(q) - 0.5)
               + (vnoise(q * 2.05 + 11.0) - 0.5) * 0.42;
        }
        /* Výsledná výška skořepiny. Mocnina nechá obě skořepiny
           doběhnout k obrysu naplocho. Kdyby u kraje stály svisle,
           vznikne po boku trička široká stěna, která při otočení
           chytne lesk a vypadá jako plastová hrana.                   */
        float bulge(vec2 q, vec2 p) {
          float k = puff(q);
          return uAmp * pow(max(k, 0.0), 1.15)
               + ((texture2D(uDrape, q).r - 0.5) * uDrapeAmp
                  + ripple(p) * uWave + folds(p) * uFold) * k;
        }
      `)
      .replace('#include <beginnormal_vertex>', `
        float e = 0.0058;   // krok derivace zhruba po jednom políčku sítě
        float b0 = bulge(uv, position.xy);
        float bx = bulge(uv + vec2(e, 0.0), position.xy + vec2(e * uSize.x, 0.0));
        float by = bulge(uv + vec2(0.0, e), position.xy + vec2(0.0, e * uSize.y));

        // sklon v metrech na metr: rozdíl výšky děleno šířkou kroku
        vec3 objectNormal = normalize(vec3(-(bx - b0) / (e * uSize.x),
                                           -(by - b0) / (e * uSize.y), uSign));
        vThick = puff(uv);
        float zz = uSign * b0;
        #ifdef USE_TANGENT
          vec3 objectTangent = vec3( tangent.xyz );
        #endif
      `)
      .replace('#include <begin_vertex>', `
        /* Rozvlnění obrysu. Silueta je jinak dokonalý oblouk z obrázku
           a právě podle ní se pozná, že jde o plochou fotku. Posun se
           pouští jen u okraje, uvnitř by rozmazal potisk.             */
        // jen dole: rameno drží tvar, vlní se lem a rukávy
        float edge = (1.0 - smoothstep(0.0, 0.30, puff(uv)))
                   * (1.0 - smoothstep(0.15, 0.62, uv.y));
        vec2 wob = vec2(folds(position.xy + vec2(7.3, 2.1)),
                        folds(position.xy + vec2(19.7, 5.5)));
        vec3 transformed = vec3(position.xy + wob * uSilh * edge, position.z + zz);
      `);

    /* Prosvícení a obrysové světlo. Slunce svítí zezadu, tenká místa
       bavlny ho pouštějí skrz, a na vlasu po obrysu se zrcadlí obloha.
       Bez toho zůstane černé tričko plochá silueta.                   */
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `
        #include <common>
        uniform vec3 uThruColor, uRimColor;
        uniform float uThru, uRim;
        varying float vThick;
      `)
      .replace('#include <lights_physical_fragment>', `
        #include <lights_physical_fragment>
        /* Na svislé stěně u obrysu se lesk vlasu sbalí do světlého
           pruhu přes celý bok. Skutečná látka se tam ohýbá do lemu a
           žádný takový pruh nemá, tak se lesk u kraje zavře.          */
        material.sheenColor *= smoothstep(0.0, 0.06, vThick);
      `)
      .replace('#include <map_fragment>', `
        #include <map_fragment>
        /* Obrys ve fotce je odmíchaný do bílého pozadí. Na čelním
           pohledu to nevadí, ale otočené tričko ten proužek roztáhne
           přes celý bok a vypadá to jako šedý plastový lem. Krajní
           pásek se proto ztmaví — u skutečného trička je hrana lemu
           stejně nejtmavší místo.                                     */
        diffuseColor.rgb *= mix(0.22, 1.0, smoothstep(0.0, 0.035, vThick));
      `)
      .replace('#include <opaque_fragment>', `
        vec3 Vv = normalize(vViewPosition);
        #if NUM_DIR_LIGHTS > 0
          vec3 Ls = normalize(directionalLights[0].direction);
          // koukám proti slunci × plocha je k němu zády = svítí skrz;
          // u obrysu je cesta látkou nejdelší, tam se musí zavřít,
          // jinak kolem trička vznikne hnědá svatozář
          float thru = pow(clamp(dot(Vv, -Ls), 0.0, 1.0), 3.0)
                     * clamp(dot(-normal, Ls), 0.0, 1.0)
                     * smoothstep(0.0, 0.10, vThick);
          outgoingLight += uThruColor * directionalLights[0].color * thru * uThru;
        #endif
        /* Obrysové světlo přichází z oblohy, tedy shora. Kdyby se
           přičítalo do všech stran, ohoří po bocích trička světlý
           lem, který při otočení vypadá jako plastová hrana.        */
        vec3 upV = normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz);
        float rim = pow(1.0 - clamp(abs(dot(normal, Vv)), 0.0, 1.0), 3.2)
                  * clamp(dot(normal, upV) * 0.5 + 0.5, 0.0, 1.0);
        outgoingLight += uRimColor * rim * uRim;
        #include <opaque_fragment>
      `);
  };
  return mat;
}

function shell(sign) {
  return new THREE.Mesh(new THREE.PlaneGeometry(CFG.width, CFG.width, 190, 190), shellMaterial(sign));
}

const logo = new THREE.Group();

function fitShirt() {
  const img = shirtTex.image;
  if (!img || !img.width) return;
  if (!drapeU.done) { drapeU.done = true; drapeU.value = drapeTexture(img) || drapeU.value; }
  const hh = CFG.width * img.height / img.width;
  for (const m of [front, back]) {
    m.geometry.dispose();
    m.geometry = new THREE.PlaneGeometry(CFG.width, hh, 190, 190);
  }
  sizeU.value.set(CFG.width, hh);
}

/* --------------------------- louka ------------------------------ */
const GROUND_Y = -1.90;
const BLADE_H  = 0.72;
const BLADES   = innerWidth < 700 ? 36000 : 88000;
const FLOWERS  = 1200;

scene.fog = new THREE.Fog(new THREE.Color(FOG_HEX), 12, 30);

/* Terén: hodnotový šum. Stejná funkce posadí zem i každé stéblo,
   takže tráva nikde nevisí ve vzduchu ani se nepropadá.            */
function hash2(x, z) {
  const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function noise2(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi),     b = hash2(xi + 1, zi);
  const c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function rawTerrain(x, z) {
  return (noise2(x * 0.021, z * 0.021) - 0.5) * 1.30
       + (noise2(x * 0.055, z * 0.055) - 0.5) * 0.60
       + (noise2(x * 0.17,  z * 0.17)  - 0.5) * 0.24
       + (noise2(x * 0.52,  z * 0.52)  - 0.5) * 0.07;
}
/* Šum nemá střední hodnotu přesně 0.5, takže se terén jako celek
   propadl pod GROUND_Y a tráva zmizela pod spodní hranou záběru.
   Průměr si spočítáme a odečteme.                                  */
const terrainBias = (() => {
  let s = 0, n = 0;
  for (let x = -34; x <= 34; x += 2) for (let z = -34; z <= 34; z += 2) { s += rawTerrain(x, z); n++; }
  return s / n;
})();
/* Velké vlny krajiny přidáváme až s odstupem od kamery. Kdyby platily
   i v popředí, mohl by se terén zvednout nad kameru a zakrýt scénu.   */
function terrain(x, z) {
  const d = Math.hypot(x, z - CAM_Z);
  const w = Math.max(0, Math.min(1, (d - 9) / 20));
  const swell = (noise2(x * 0.0085, z * 0.0085) - 0.5) * 1.5;
  return rawTerrain(x, z) - terrainBias + swell * w * w;
}

// podklad, aby mezi stébly neprosvítala obloha
const soilGeo = new THREE.PlaneGeometry(120, 120, 190, 190).rotateX(-Math.PI / 2);
{
  const pos = soilGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, terrain(pos.getX(i), pos.getZ(i)));
  soilGeo.computeVertexNormals();
}
const soilMat = new THREE.MeshStandardMaterial({
  color: 0x3f4f24, roughness: 1, metalness: 0
});
/* Hlína mezi stébly musí ztmavnout pod tričkem stejně jako tráva,
   jinak se stín na okraji záhonu láme.                              */
soilMat.onBeforeCompile = (shader) => {
  shader.uniforms.uHaze = { value: new THREE.Color(HAZE_HEX) };
  shader.uniforms.uShadow = shadowU;
  shader.uniforms.uShadowAxis = shadowAxisU;
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec2 vXZ;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvXZ = (modelMatrix * vec4(position, 1.0)).xz;');
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform vec4 uShadow;\nuniform vec2 uShadowAxis;\nuniform vec3 uHaze;\nvarying vec2 vXZ;')
    .replace('#include <opaque_fragment>', `
      vec2 sd = vXZ - uShadow.zw;
      sd = vec2(dot(sd, uShadowAxis) / 1.55, dot(sd, vec2(-uShadowAxis.y, uShadowAxis.x)));
      outgoingLight *= 1.0 - uShadow.y * (1.0 - smoothstep(0.0, uShadow.x, length(sd)));
      outgoingLight = mix(outgoingLight, uHaze, smoothstep(9.0, 34.0, vFogDepth) * 0.66);
      #include <opaque_fragment>
    `);
};

// náhodný bod v zorném klínu kamery, s rezervou do stran
function wedge() {
  /* Rozdělení do dálky. Plocha klínu roste se vzdáleností, takže
     rovnoměrné losování nasází daleko řídkou trávu a mezi loukou a
     obzorem zůstane holá díra. Mocnina hustotu vzadu dorovná a
     vpředu ji nechá zhoustnout do popředí.                          */
  const d = 0.5 + 42 * Math.pow(Math.random(), 0.62);
  const half = 0.42 * d + 3;
  return [(Math.random() - 0.5) * 2 * half, CAM_Z - d];
}

/* Stéblo: dlouhé, ke špičce zúžené a prohnuté do oblouku. Ohyb je
   zapečený do geometrie, náhodné natočení instance pak rozhodí
   směry, takže se tráva neklaní všechna na jednu stranu.           */
function bladeGeometry() {
  const SEG = 7;
  const g = new THREE.PlaneGeometry(0.034, BLADE_H, 1, SEG);
  g.translate(0, BLADE_H / 2, 0);
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const base = new THREE.Color(0x1d3110);   // u kořene skoro bez světla
  const tip  = new THREE.Color(0x83a24a);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    // bez ořezu vyjde na krajní řadě k = 1.0000001 a Math.pow(záporné, 0.55) je NaN
    const k = Math.min(1, Math.max(0, pos.getY(i) / BLADE_H));
    pos.setX(i, pos.getX(i) * Math.pow(1 - k, 0.55));   // špička do ostra
    pos.setY(i, pos.getY(i) * (1 - 0.18 * k * k));      // oblouk zkracuje výšku
    pos.setZ(i, Math.pow(k, 1.7) * 0.30);
    c.copy(base).lerp(tip, Math.pow(k, 0.75));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();

  /* Stéblo není placka, po délce je složené do mělkého V. Přidat na to
     geometrii by znamenalo zdvojnásobit trojúhelníky, ale stačí rozevřít
     normály do stran: každá polovina pak chytá světlo jinak a po délce
     stébla proběhne ostrý přechod. Právě ten z trávy dělá trávu, plochý
     obdélník vypadá jako proužek fólie.                               */
  const nrm = g.attributes.normal, pp = g.attributes.position;
  const SPLAY = 0.70;
  for (let i = 0; i < nrm.count; i++) {
    const sx = Math.sign(pp.getX(i)) || 0;
    const nx = nrm.getX(i) + sx * SPLAY, ny = nrm.getY(i), nz = nrm.getZ(i);
    const l = Math.hypot(nx, ny, nz) || 1;
    nrm.setXYZ(i, nx / l, ny / l, nz / l);
  }
  return g;
}

/* Stín. Slunce je nízko a v oparu, ostrý obrys by tu byl lež: co je
   pod tričkem doopravdy vidět, je měkké zatemnění, protažené po směru
   světla a odsazené na odvrácenou stranu.                            */
const SHADOW_AXIS = (() => {
  const d = SUN_POS.clone().negate();          // od slunce k tričku
  return new THREE.Vector2(d.x, d.z).normalize();
})();
const shadowU = { value: new THREE.Vector4(2.0, 0.5, 0, 0) };   // poloměr, síla, střed x, z
const shadowAxisU = { value: SHADOW_AXIS };
const grassMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  side: THREE.DoubleSide,
  roughness: 0.95,
  metalness: 0
});

const wind = { value: 0 };
grassMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = wind;
  shader.uniforms.uShadow = shadowU;
  shader.uniforms.uShadowAxis = shadowAxisU;
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nuniform float uTime;\nuniform vec4 uShadow;\nuniform vec2 uShadowAxis;')
    .replace('#include <color_vertex>', `
      #include <color_vertex>
      vec3 gip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
      vec2 sd = gip.xz - uShadow.zw;
      sd = vec2(dot(sd, uShadowAxis) / 1.55, dot(sd, vec2(-uShadowAxis.y, uShadowAxis.x)));
      vColor.rgb *= 1.0 - uShadow.y * (1.0 - smoothstep(0.0, uShadow.x, length(sd)));
    `)
    .replace('#include <begin_vertex>', `
      #include <begin_vertex>
      float bh = clamp(transformed.y / ${BLADE_H.toFixed(3)}, 0.0, 1.0);
      vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
      // poryv: pomalá vlna, která běží krajinou, plus drobné chvění
      float gust = sin(uTime * 0.42 + ip.x * 0.16 + ip.z * 0.11) * 0.5 + 0.5;
      float w = sin(uTime * 1.4 + ip.x * 0.55 + ip.z * 0.8) * 0.6
              + sin(uTime * 3.1 + ip.x * 1.7 - ip.z * 1.1) * 0.25;
      float amp = (0.35 + gust * 0.85) * bh * bh;
      transformed.x += w * amp * 0.20;
      transformed.z += w * amp * 0.09;
    `);

  /* Prosvícení stébel. V protisvětle je tráva hlavně průsvitná, ne
     odražená, a bez toho vypadá jako plastová. Levné napodobení:
     přičti barvu stébla podle toho, jak moc se díváš proti slunci. */
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform float uTrans;\nuniform vec3 uHaze;')
    .replace('#include <opaque_fragment>', `
      #if NUM_DIR_LIGHTS > 0
        vec3 L = normalize(directionalLights[0].direction);
        float toward = clamp(dot(normalize(vViewPosition), -L), 0.0, 1.0);
        float thru   = clamp(dot(normalize(-vNormal), L) * 0.5 + 0.5, 0.0, 1.0);
        outgoingLight += vColor.rgb * directionalLights[0].color
                       * pow(toward, 2.5) * thru * uTrans;
      #endif
      /* Přízemní opar. Scénická mlha začíná až za tričkem, jinak by
         zamlžila i jeho, ale louka se musí ztrácet mnohem dřív —
         bez toho je pás trávy stejně sytý u nohou i na obzoru.       */
      outgoingLight = mix(outgoingLight, uHaze,
                          smoothstep(9.0, 34.0, vFogDepth) * 0.66);
      #include <opaque_fragment>
    `);
  shader.uniforms.uTrans = { value: 1.15 };
  shader.uniforms.uHaze = { value: new THREE.Color(HAZE_HEX) };
};

const grass = new THREE.InstancedMesh(bladeGeometry(), grassMat, BLADES);
grass.frustumCulled = false;
{
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const e = new THREE.Euler();
  const p = new THREE.Vector3();
  const s = new THREE.Vector3();
  const c = new THREE.Color();
  // trsy: náhodně rozházená stébla vypadají jako koberec, tráva roste ve shlucích
  const CLUMPS = Math.round(BLADES / 26);
  const clump = [];
  for (let i = 0; i < CLUMPS; i++) {
    // kamera je pevná, tak sázíme jen do klínu, který je vidět;
    // rozprostřít stejný počet stébel dokola by znamenalo řídkou trávu
    const [x, z] = wedge();
    clump.push([x, z, 0.75 + Math.random() * 0.55]);
  }
  for (let i = 0; i < BLADES; i++) {
    const [cx, cz, vigor] = clump[(Math.random() * CLUMPS) | 0];
    const x = cx + (Math.random() - 0.5) * 1.5;
    const z = cz + (Math.random() - 0.5) * 1.5;
    p.set(x, GROUND_Y + terrain(x, z) - 0.03, z);
    e.set((Math.random() - 0.5) * 0.55, Math.random() * Math.PI * 2, (Math.random() - 0.5) * 0.55);
    q.setFromEuler(e);
    // pár procent stébel vyžene do klasu; rovná linka trávy je
    // nejrychlejší způsob, jak z louky udělat koberec
    const tall = Math.random() < 0.02 ? 1.30 + Math.random() * 0.55 : 1.0;
    s.set((0.7 + Math.random() * 0.6) / Math.sqrt(tall), vigor * (0.45 + Math.random() * 1.25) * tall, 1);
    m.compose(p, q, s);
    grass.setMatrixAt(i, m);

    // většina zelená, část do žluta, pár suchých stébel
    const dry = Math.random();
    if (dry > 0.9)      c.setHSL(0.12 + Math.random() * 0.03, 0.36, 0.38);
    else if (dry > 0.6) c.setHSL(0.19 + Math.random() * 0.03, 0.44, 0.31);
    else                c.setHSL(0.245 + (Math.random() - 0.5) * 0.06, 0.30 + Math.random() * 0.20, 0.19 + Math.random() * 0.13);
    // nízkofrekvenční skvrnitost: souvislé tmavší a světlejší plochy,
    // bez toho je louka jednolitý koberec jedné barvy
    const patch = 0.55 + 0.75 * noise2(x * 0.13, z * 0.13);
    c.multiplyScalar(patch);
    grass.setColorAt(i, c);
  }
}
grass.instanceMatrix.needsUpdate = true;
scene.add(grass);

/* Kvítka: dva zkřížené obdélníky s vygenerovanou texturou. Billboard
   by se při otáčení scény protáčel, křížek drží tvar z každé strany. */
function flowerTexture() {
  const S = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const x = cv.getContext('2d');
  x.translate(S / 2, S / 2);
  for (let i = 0; i < 5; i++) {
    x.rotate(Math.PI * 2 / 5);
    const g = x.createRadialGradient(0, -S * 0.24, 0, 0, -S * 0.24, S * 0.20);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.7, '#fdf1f2');
    g.addColorStop(1, '#f0cdd4');
    x.fillStyle = g;
    x.beginPath();
    x.ellipse(0, -S * 0.24, S * 0.13, S * 0.19, 0, 0, Math.PI * 2);
    x.fill();
  }
  x.fillStyle = '#e8c25c';
  x.beginPath();
  x.arc(0, 0, S * 0.09, 0, Math.PI * 2);
  x.fill();
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
{
  const q1 = new THREE.PlaneGeometry(0.15, 0.15);
  const q2 = q1.clone().rotateY(Math.PI / 2);
  const petals = mergeTwo(q1, q2);

  });
  const flowers = new THREE.InstancedMesh(petals, fmat, FLOWERS);
  flowers.frustumCulled = false;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const p = new THREE.Vector3(), s = new THREE.Vector3();
  for (let i = 0; i < FLOWERS; i++) {
    const [x, z] = wedge();
    p.set(x, GROUND_Y + terrain(x, z) + 0.20 + Math.random() * 0.28, z);
    e.set((Math.random() - 0.5) * 0.5, Math.random() * Math.PI * 2, (Math.random() - 0.5) * 0.5);
    q.setFromEuler(e);
    const k = 0.7 + Math.random() * 0.7;
    s.set(k, k, k);
    m.compose(p, q, s);
    flowers.setMatrixAt(i, m);
  }
  flowers.instanceMatrix.needsUpdate = true;
  scene.add(flowers);
}

// spojení dvou jednoduchých geometrií bez importu BufferGeometryUtils
function mergeTwo(a, b) {
  const g = new THREE.BufferGeometry();
  for (const name of ['position', 'normal', 'uv']) {
    const A = a.attributes[name], B = b.attributes[name];
    const arr = new Float32Array(A.array.length + B.array.length);
    arr.set(A.array, 0);
    arr.set(B.array, A.array.length);
    g.setAttribute(name, new THREE.BufferAttribute(arr, A.itemSize));
  }
  const ai = a.index.array, bi = b.index.array;
  const off = a.attributes.position.count;
  const idx = new Uint16Array(ai.length + bi.length);
  idx.set(ai, 0);
  for (let i = 0; i < bi.length; i++) idx[ai.length + i] = bi[i] + off;
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}

/* --------------------- ovládání myší --------------------------- */
const YAW_MAX = 1.05;   // ±60°: dál už je tričko jen na hraně a nemá co ukázat

const DRAG = {
  sens:      2.6,    // kolik otáčky ujede tažení přes celou šířku okna
  damping:   0.02,   // zbytek rychlosti za sekundu po puštění (níž = kratší doběh)
  tiltMax:   0.55,   // dokud lze naklopit nahoru a dolů, v radiánech
  resume:    1.6     // po kolika sekundách klidu se zase rozjede sám
};

let rotY = 0, rotX = 0;          // aktuální natočení
let velY = 0, velX = 0;          // setrvačnost po puštění
let dragging = false, frozen = false;
let lastX = 0, lastY = 0, lastMove = 0;
let idleFrom = performance.now();

const canvas = renderer.domElement;

function onDown(e) {
  dragging = true;
  frozen = false;
  velY = velX = 0;
  lastX = e.clientX; lastY = e.clientY;
  lastMove = performance.now();
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = 'grabbing';
}

function onMove(e) {
  if (!dragging) return;
  const now = performance.now();
  const dt = Math.max((now - lastMove) / 1000, 0.001);
  const dy = (e.clientX - lastX) / innerWidth * Math.PI * DRAG.sens;
  const dx = (e.clientY - lastY) / innerHeight * Math.PI * DRAG.sens;

  rotY += dy;
  rotX = Math.max(-DRAG.tiltMax, Math.min(DRAG.tiltMax, rotX + dx));
  if (Math.abs(rotY) > YAW_MAX) { rotY = Math.sign(rotY) * YAW_MAX; velY = 0; }

  // rychlost pro doběh: průměruj se starou hodnotou, jinak jeden trhavý
  // vzorek na konci tažení určí celý setrvačník
  velY = velY * 0.6 + (dy / dt) * 0.4;
  velX = velX * 0.6 + (dx / dt) * 0.4;

  lastX = e.clientX; lastY = e.clientY; lastMove = now;
}

function onUp(e) {
  if (!dragging) return;
  dragging = false;
  idleFrom = performance.now();
  if (performance.now() - lastMove > 120) velY = velX = 0;   // pauza před puštěním = žádný švih
  canvas.releasePointerCapture?.(e.pointerId);
  canvas.style.cursor = 'grab';
}

canvas.style.cursor = 'grab';
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);

/* ----------------------- obraz z objektivu -----------------------
   Scéna se nekreslí rovnou na plátno, ale do textury, a teprve z ní
   se skládá výsledek. Objektiv má hloubku ostrosti: tráva u nohou a
   opar na obzoru se rozostří, tričko zůstane ostré. Bez toho je
   všechno stejně ostré a obraz se čte jako render, ne jako fotka.
   K tomu patří ještě rozpití světel, vinětace a zrno.
   Když se něco z toho nepovede založit, kreslí se scéna postaru.    */
let post = null;
try {
  if (renderer.capabilities.isWebGL2) {
    const rt = new THREE.WebGLRenderTarget(1, 1, {
      depthBuffer: true,
      stencilBuffer: false,
      colorSpace: THREE.SRGBColorSpace
    });
    /* Renderer dělá tone mapping a převod do sRGB jen při kreslení na
       plátno; do textury by spadl surový lineární obraz. Tenhle příznak
       mu řekne, ať s texturou zachází jako s plátnem, takže do ní padne
       přesně to, co by jinak bylo vidět.
       Počítat poslední krok ze surových světel se neosvědčilo: hodnoty
       černého trička leží tak nízko, že se v nich tone mapping utopil
       v zaokrouhlení a látka se zrnila.                                */
    rt.isXRRenderTarget = true;
    rt.depthTexture = new THREE.DepthTexture(1, 1, THREE.UnsignedIntType);
    rt.depthTexture.format = THREE.DepthFormat;

    const uni = {
      tScene:   { value: rt.texture },
      tDepth:   { value: rt.depthTexture },
      uPixel:   { value: new THREE.Vector2() },
      uRes:     { value: new THREE.Vector2() },
      uNearFar: { value: new THREE.Vector2(camera.near, camera.far) },
      uFocus:   { value: CAM_Z },
      uBlur:    { value: new THREE.Vector2(CFG.blurNear, CFG.blurFar) },
      uGrain:   { value: CFG.grain },
      uVig:     { value: CFG.vignette },
      uTime:    { value: 0 },
      uTaps:    { value: innerWidth < 700 ? 8 : 22 }    // na mobilu levněji
    };

    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.RawShaderMaterial({
      glslVersion: THREE.GLSL3,
      uniforms: uni,
      vertexShader: `
        in vec3 position;
        in vec2 uv;
        out vec2 vUv;
        void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
      `,
      fragmentShader: `
        precision highp float;
        precision highp sampler2D;
        in vec2 vUv;
        out vec4 fragColor;
        uniform sampler2D tScene, tDepth;
        uniform vec2 uPixel, uRes, uNearFar, uBlur;
        uniform float uFocus, uGrain, uVig, uTime;
        uniform int uTaps;

        // hloubka z depth bufferu na vzdálenost od kamery v metrech
        float viewDepth(vec2 uv) {
          float d = texture(tDepth, uv).x;
          float ndc = d * 2.0 - 1.0;
          float n = uNearFar.x, f = uNearFar.y;
          return (2.0 * n * f) / (f + n - ndc * (f - n));
        }
        /* Poloměr rozptylového kroužku v pixelech. Znaménko drží
           informaci, na které straně roviny ostrosti pixel leží —
           popředí se totiž musí chovat jinak než pozadí.              */
        float cocSigned(vec2 uv) {
          float z = max(viewDepth(uv), 0.001);
          float c = 1.0 - uFocus / z;                 // < 0 před rovinou ostrosti
          float k = uRes.y / 750.0;                   // v pixelech, ať to sedí na každém okně
          float r = min((c < 0.0 ? -c * uBlur.x : c * uBlur.y) * k, 24.0 * k);
          return c < 0.0 ? -r : r;
        }
        float coc(vec2 uv) { return abs(cocSigned(uv)); }

        float hash12(vec2 p) {
          vec3 q = fract(vec3(p.xyx) * 0.1031);
          q += dot(q, q.yzx + 33.33);
          return fract((q.x + q.y) * q.z);
        }

        void main() {
          vec3 base = texture(tScene, vUv).rgb;
          float r = coc(vUv);

          /* Hloubka ostrosti. Sbírá se po spirále a každý vzorek se
             připustí jen tehdy, když jeho vlastní kroužek na tenhle
             pixel dosáhne. Jinak by ostré pozadí prosakovalo přes
             rozmazané popředí a kolem trávy by byl lem.               */
          vec3 sum = base;
          float wsum = 1.0;
          if (r > 0.6) {
            float N = float(uTaps);
            for (int i = 0; i < uTaps; i++) {
              float fi = float(i) + 0.5;
              float a = fi * 2.39996323;                    // zlatý úhel
              float rad = r * sqrt(fi / N);
              vec2 off = vec2(cos(a), sin(a)) * rad;
              vec2 uv2 = vUv + off * uPixel;
              /* Kroužek. Rozostřený bod se v objektivu nerozteče do
                 placky, ale do kolečka s hustším okrajem — právě proto
                 mají světla v pozadí tvar, a ne mlhu.                  */
              float w = clamp(coc(uv2) - rad + 1.0, 0.0, 1.0)
                      * (0.55 + 0.85 * rad / max(r, 0.001));
              sum += texture(tScene, uv2).rgb * w;
              wsum += w;
            }
          }
          vec3 col = sum / wsum;

          /* Rozpití světel. Protisvětlo se v objektivu roztéká přes
             hrany, opar musí do trávy a do trička trochu vtéct.       */
          vec3 glow = vec3(0.0);
          for (int i = 0; i < 8; i++) {
            float a = float(i) * 0.7853981 + 0.4;
            vec2 off = vec2(cos(a), sin(a)) * uRes.y * 0.020;
            glow += max(texture(tScene, vUv + off * uPixel).rgb - 0.80, 0.0);
          }
          col += glow * 0.075;

          // vlastní barevná vada objektivu, znatelná jen u krajů
          float rr = length(vUv - 0.5);
          vec2 ca = (vUv - 0.5) * rr * rr * 0.010;
          col.r = mix(col.r, texture(tScene, vUv + ca).r, 0.55);
          col.b = mix(col.b, texture(tScene, vUv - ca).b, 0.55);

          // mírná esíčková křivka: film nikdy nekreslí přechody lineárně
          col = mix(col, col * col * (3.0 - 2.0 * col), 0.10);

          col *= 1.0 - uVig * pow(clamp(rr * 1.42, 0.0, 1.0), 2.6);

          // zrno: v tmavých místech je ho vždycky vidět víc, a zároveň
          // rozbíjí pásy v přechodu oblohy, které by v osmi bitech byly
          float g = hash12(vUv * uRes + uTime) - 0.5;
          float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
          col += g * uGrain * (0.5 + 0.7 * (1.0 - lum));

          fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }
      `,
      depthTest: false,
      depthWrite: false
    }));
    quad.frustumCulled = false;
    const postScene = new THREE.Scene();
    postScene.add(quad);
    const postCam = new THREE.Camera();

    post = {
      rt, uni,
      resize(w, h) {
        /* Vyhlazení hran. Vícenásobné vzorkování se do textury s
           hotovým obrazem přenést nedá — formáty se při slučování
           neshodnou — takže se scéna kreslí s přesahem rozlišení a
           zmenšení při skládání hrany posbírá. Nad rozumný počet
           pixelů se přesah pouští, jinak by to na velkém displeji
           bylo dražší, než je nutné.                                  */
        const ss = Math.max(1, Math.min(1.6, Math.sqrt(7.5e6 / Math.max(1, w * h))));
        const rw = Math.round(w * ss), rh = Math.round(h * ss);
        rt.setSize(rw, rh);
        uni.uPixel.value.set(1 / rw, 1 / rh);
        uni.uRes.value.set(rw, rh);
        uni.uNearFar.value.set(camera.near, camera.far);
      },
      render(t) {
        uni.uFocus.value = camera.position.z;      // ostří se na tričko
        uni.uTime.value = t * 60.0;
        renderer.setRenderTarget(rt);
        renderer.render(scene, camera);
        renderer.setRenderTarget(null);
        renderer.render(postScene, postCam);
      }
    };
  }
} catch (err) {
  post = null;
}

/* ------------------------- animace ----------------------------- */
const clock = new THREE.Clock();
const smoothstep = (e0, e1, x) => {
  const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
};

// window.__setAngle(rad) natočí objekt na daný úhel a nechá ho stát
window.__dbg = { scene, camera, THREE };
window.__setAngle = (a) => { rotY = a; rotX = 0; velY = velX = 0; frozen = true; };

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  let auto = 0;
  if (!dragging && !frozen && !reduceMotion) {
    const idle = (performance.now() - idleFrom) / 1000;
    auto = smoothstep(DRAG.resume * 0.4, DRAG.resume, idle);
  }

  if (!dragging) {
    rotY += velY * dt;
    rotX += velX * dt;
    const damp = Math.pow(DRAG.damping, dt);
    velY *= damp; velX *= damp;

    // ploché tričko nemá smysl točit dokola, samo se vrací do klidného kývání
    const sway = Math.sin(t * CFG.swaySpeed) * CFG.sway;
    rotY += (sway - rotY) * (1 - Math.pow(0.22, dt)) * auto;
    rotX = Math.max(-DRAG.tiltMax, Math.min(DRAG.tiltMax, rotX));
    if (Math.abs(rotY) > YAW_MAX) { rotY = Math.sign(rotY) * YAW_MAX; velY = 0; }
    rotX += (0 - rotX) * (1 - Math.pow(0.35, dt)) * auto;   // naklopení se samo srovná
  }

  wind.value = t;
  cloth.value = t * CFG.waveSpeed;

  logo.rotation.y = rotY;
  logo.rotation.x = rotX;
  logo.rotation.z = Math.sin(t * 0.31) * 0.045 * auto;
  logo.position.y = CFG.hover + Math.sin(t * CFG.floatSpeed) * CFG.float;

  /* Stín se s výškou trička rozšiřuje, bledne a odsouvá se dál po
     směru světla, přesně jak se vzdaluje předmět od země.            */
  const h = logo.position.y - GROUND_Y;
  const off = h * 0.28;
  shadowU.value.set(2.85 + h * 0.20, 0.84 - h * 0.06,
                    SHADOW_AXIS.x * off, SHADOW_AXIS.y * off);

  if (post) post.render(t); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

/* na úzkých displejích je limitem šířka, ne výška: odjeď kamerou dál,
   jinak se objekt na mobilu ořízne po stranách */
function fit() {
  const vw = Math.max(1, innerWidth), vh = Math.max(1, innerHeight);
  const aspect = vw / vh;
  camera.aspect = aspect;
  camera.position.z = CAM_Z * Math.max(1, 0.62 / aspect);
  camera.lookAt(0, 0.05, 0);
  // mlha musí začínat až za pinem, jinak by se zamlžil i on
  scene.fog.near = camera.position.z + 1;
  scene.fog.far  = camera.position.z + 23;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  renderer.setSize(vw, vh);
  if (post) {
    const buf = renderer.getDrawingBufferSize(new THREE.Vector2());
    post.resize(buf.x, buf.y);
  }
  refreshSky();
}
addEventListener('resize', fit);
fit();
</script>
